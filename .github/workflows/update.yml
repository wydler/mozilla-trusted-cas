name: Update Mozilla CA bundle

on:
  workflow_dispatch:

  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

env:
  # Pinned curl release commit containing mk-ca-bundle.pl.
  CURL_COMMIT: '0134682'

  # Mozilla NSS certdata source.
  CERTDATA_URL: 'https://hg.mozilla.org/releases/mozilla-release/raw-file/default/security/nss/lib/ckfw/builtins/certdata.txt'

  # curl repository.
  CURL_REPOSITORY: 'https://github.com/curl/curl'

jobs:
  update:
    name: Generate CA bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get install --yes \
            curl \
            jq \
            openssl \
            perl

      - name: Download mk-ca-bundle.pl
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output mk-ca-bundle.pl \
            "${CURL_REPOSITORY}/raw/${CURL_COMMIT}/scripts/mk-ca-bundle.pl"

          chmod 755 mk-ca-bundle.pl

      - name: Validate mk-ca-bundle.pl
        run: |
          perl -c mk-ca-bundle.pl

      - name: Determine mk-ca-bundle.pl version
        id: generator
        run: |
          version="$(
            sed -nE "s/^[[:space:]]*my[[:space:]]+\$version[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*$/\1/p" \
              mk-ca-bundle.pl |
            head -n1
          )"
      
          if [ -z "${version}" ]; then
            echo "::error::Unable to determine mk-ca-bundle.pl version"
            echo "::error::Could not find 'my \$version = ...' in mk-ca-bundle.pl"
            exit 1
          fi
      
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "mk-ca-bundle.pl version: ${version}"
          echo "curl commit: ${CURL_COMMIT}"

      - name: Download Mozilla certdata.txt
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output certdata.txt \
            "${CERTDATA_URL}"

          test -s certdata.txt

      - name: Calculate certdata checksum
        id: source
        run: |
          sha256="$(
            sha256sum certdata.txt |
            awk '{print $1}'
          )"

          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

          echo "Mozilla certdata.txt SHA256:"
          echo "${sha256}"

      - name: Generate cacert.pem
        run: |
          ./mk-ca-bundle.pl \
            -f \
            -m \
            -n \
            cacert.pem

          test -s cacert.pem

      - name: Validate generated CA bundle
        id: bundle
        run: |
          certificate_count="$(
            grep -c '^-----BEGIN CERTIFICATE-----$' cacert.pem
          )"

          echo "Certificate count: ${certificate_count}"

          if [ "${certificate_count}" -lt 1000 ]; then
            echo "::error::Unexpectedly low certificate count: ${certificate_count}"
            exit 1
          fi

          openssl crl2pkcs7 \
            -nocrl \
            -certfile cacert.pem |
          openssl pkcs7 \
            -print_certs \
            -noout

          sha256="$(
            sha256sum cacert.pem |
            awk '{print $1}'
          )"

          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

          echo "CA bundle SHA256:"
          echo "${sha256}"

      - name: Generate metadata.json
        run: |
          previous_generated_at=""

          if [ -f metadata.json ]; then
            previous_generated_at="$(
              jq -r '.generated_at // empty' metadata.json
            )"
          fi

          if git diff --quiet -- cacert.pem; then
            generated_at="${previous_generated_at}"
          else
            generated_at="$(
              date --utc '+%Y-%m-%dT%H:%M:%SZ'
            )"
          fi

          jq -n \
            --arg source_name \
              "Mozilla NSS Root Certificate Store" \
            --arg source_url \
              "${CERTDATA_URL}" \
            --arg source_tree \
              "mozilla-release" \
            --arg source_sha256 \
              "${{ steps.source.outputs.sha256 }}" \
            --arg generator_name \
              "mk-ca-bundle.pl" \
            --arg generator_repository \
              "${CURL_REPOSITORY}" \
            --arg generator_commit \
              "${CURL_COMMIT}" \
            --arg generator_version \
              "${{ steps.generator.outputs.version }}" \
            --arg bundle_file \
              "cacert.pem" \
            --arg bundle_sha256 \
              "${{ steps.bundle.outputs.sha256 }}" \
            --argjson certificate_count \
              "${{ steps.bundle.outputs.certificate_count || 0 }}" \
            --arg generated_at \
              "${generated_at}" \
            '{
              source: {
                name: $source_name,
                url: $source_url,
                tree: $source_tree,
                sha256: $source_sha256
              },
              generator: {
                name: $generator_name,
                repository: $generator_repository,
                commit: $generator_commit,
                version: $generator_version
              },
              bundle: {
                file: $bundle_file,
                sha256: $bundle_sha256,
                certificate_count: $certificate_count
              },
              generated_at: $generated_at
            }' > metadata.json

          jq . metadata.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- cacert.pem metadata.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "CA bundle is already up to date."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "CA bundle has changed."
          fi

      - name: Show changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --stat -- cacert.pem metadata.json

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: update/mozilla-ca-bundle
          delete-branch: true
          commit-message: 'chore: update Mozilla CA bundle'
          title: 'chore: update Mozilla CA bundle'
          body: |
            ## Mozilla CA bundle update

            This PR updates the Mozilla CA bundle generated from
            the Mozilla NSS `certdata.txt`.

            ### Source

            `${{ env.CERTDATA_URL }}`

            ### Generator

            `mk-ca-bundle.pl`
            curl commit: `${{ env.CURL_COMMIT }}`
            version: `${{ steps.generator.outputs.version }}`

            ### Bundle

            Certificates:
            `${{ steps.bundle.outputs.certificate_count }}`

            SHA256:
            `${{ steps.bundle.outputs.sha256 }}`

            The generated bundle was validated with OpenSSL.

            `metadata.json` contains the complete provenance information.

            This PR was created automatically by GitHub Actions.

          labels: |
            automated
            dependencies
