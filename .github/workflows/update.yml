name: Update Mozilla CA bundle

on:
  workflow_dispatch:

  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

env:
  # Pinned curl release commit containing mk-ca-bundle.pl.
  CURL_COMMIT: '01346829096c61b372692f6dc43ffa778c6caccd'

  # Mozilla NSS certdata source.
  CERTDATA_URL: 'https://hg.mozilla.org/releases/mozilla-release/raw-file/default/security/nss/lib/ckfw/builtins/certdata.txt'

  # curl repository.
  CURL_REPOSITORY: 'https://github.com/curl/curl'

  # Directory containing additional, locally trusted CA certificates.
  CUSTOM_CA_DIRECTORY: 'custom-cas'

jobs:
  update:
    name: Generate CA bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl \
            jq \
            openssl \
            perl

      - name: Create necessary metadatas
        id: metadata
        shell: bash
        run: |

          # Determines the current date in YYYYMMDD format. Using the Europe/Berlin timezone.
          current_date=$(TZ='Europe/Berlin' date +'%Y%m%d')

          # Formats the GitHub run number to exactly 4 digits and pads missing digits with leading zeros.
          gh_action_run_number=$(printf "%04d" "${GITHUB_RUN_NUMBER}")

          # Contains the current attempt number of the same workflow run. This value increases when the workflow is re-run.
          gh_action_run_attempt="${{ github.run_attempt }}"

          # Builds the version string using the format: YYYYMMDD.gh_action_run_number.gh_action_run_attempt. Example: 20260523.0042.1
          version_full=${current_date}.${gh_action_run_number}.${gh_action_run_attempt}

          gh_branch_name="updates/mozilla-ca-bundle/${version_full}"

          # GitHub Outputs
          {
            echo "gh_branch_name=${gh_branch_name}"
          } >> "$GITHUB_OUTPUT"


      - name: Download mk-ca-bundle.pl
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output mk-ca-bundle.pl \
            "${CURL_REPOSITORY}/raw/${CURL_COMMIT}/scripts/mk-ca-bundle.pl"

          chmod +x mk-ca-bundle.pl

      - name: Validate mk-ca-bundle.pl
        run: |
          perl -c mk-ca-bundle.pl

      - name: Determine mk-ca-bundle.pl version
        id: generator
        run: |
          version="$(
            awk -F"['\"]" '
              /^[[:space:]]*my[[:space:]]+\$version[[:space:]]*=/ {
                print $2
                exit
              }
            ' mk-ca-bundle.pl
          )"

          if [ -z "${version}" ]; then
            echo "::error::Unable to determine mk-ca-bundle.pl version"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          echo "mk-ca-bundle.pl version: ${version}"
          echo "curl commit: ${CURL_COMMIT}"

      - name: Download Mozilla certdata.txt
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --output certdata.txt \
            "${CERTDATA_URL}"

          test -s certdata.txt

      - name: Calculate certdata checksum
        id: source
        run: |
          sha256="$(
            sha256sum certdata.txt |
            awk '{print $1}'
          )"

          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

          echo "Mozilla certdata.txt SHA256:"
          echo "${sha256}"

      - name: Generate Mozilla cacert.pem
        run: |
          ./mk-ca-bundle.pl \
            -m \
            -n \
            cacert.pem

          test -s cacert.pem

      - name: Add custom CA certificates
        id: custom_cas
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          certificates=(
            "${CUSTOM_CA_DIRECTORY}"/*.*
          )

          custom_certificate_count=0
          custom_certificate_added=0
          custom_certificate_duplicate=0

          if [ "${#certificates[@]}" -eq 0 ]; then
            echo "No custom CA certificates found in ${CUSTOM_CA_DIRECTORY}/"
          else
            echo "Found ${#certificates[@]} custom CA file(s)."
          fi

          # Create a temporary directory containing the certificates
          # already present in the Mozilla bundle.
          existing_dir="$(mktemp -d)"

          cleanup() {
            rm -rf "${existing_dir}"
          }

          trap cleanup EXIT

          # Split the Mozilla bundle into individual certificates.
          awk '
            /-----BEGIN CERTIFICATE-----/ {
              file=sprintf("'"${existing_dir}"'/cert-%05d.pem", ++n)
            }

            file != "" {
              print > file
            }

            /-----END CERTIFICATE-----/ {
              close(file)
              file=""
            }
          ' cacert.pem

          # Build a list of SHA-256 fingerprints already contained
          # in the Mozilla bundle.
          existing_fingerprints="${existing_dir}/fingerprints.txt"
          touch "${existing_fingerprints}"

          for certificate in "${existing_dir}"/*.pem; do
            [ -f "${certificate}" ] || continue

            openssl x509 \
              -in "${certificate}" \
              -noout \
              -fingerprint \
              -sha256 |
              sed 's/^sha256 Fingerprint=//' |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]' \
              >> "${existing_fingerprints}"
          done

          for certificate in "${certificates[@]}"; do
            custom_certificate_count=$((custom_certificate_count + 1))

            echo
            echo "Processing: ${certificate}"

            # Verify that the file contains a valid X.509 certificate.
            if ! openssl x509 \
              -in "${certificate}" \
              -noout; then
              echo "::error::Invalid X.509 certificate: ${certificate}"
              exit 1
            fi

            fingerprint="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -fingerprint \
                -sha256 |
              sed 's/^sha256 Fingerprint=//' |
              tr -d ':' |
              tr '[:lower:]' '[:upper:]'
            )"

            subject="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -subject |
              sed 's/^subject=//'
            )"

            issuer="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -issuer |
              sed 's/^issuer=//'
            )"

            echo "Subject: ${subject}"
            echo "Issuer:  ${issuer}"
            echo "SHA-256: ${fingerprint}"

            if grep -Fxq "${fingerprint}" "${existing_fingerprints}"; then
              echo "Certificate already exists in cacert.pem. Skipping."
              custom_certificate_duplicate=$((custom_certificate_duplicate + 1))
              continue
            fi

            echo "Adding certificate to cacert.pem."
            ###
            subject="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -subject \
                -nameopt RFC2253 |
              sed 's/^subject=//'
            )"
            
            issuer="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -issuer \
                -nameopt RFC2253 |
              sed 's/^issuer=//'
            )"
            
            serial_number="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -serial |
              sed 's/^serial=//' |
              tr '[:lower:]' '[:upper:]' |
              sed 's/../&:/g; s/:$//'
            )"
            
            not_before="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -startdate |
              sed 's/^notBefore=//'
            )"
            
            not_after="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -enddate |
              sed 's/^notAfter=//'
            )"
            
            sha256_fingerprint="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -fingerprint \
                -sha256 |
              sed 's/^sha256 Fingerprint=//' |
              tr '[:lower:]' '[:upper:]'
            )"
            
            sha1_fingerprint="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -fingerprint \
                -sha1 |
              sed 's/^sha1 Fingerprint=//' |
              tr '[:lower:]' '[:upper:]'
            )"
            
            # Use the certificate's CN as the header.
            common_name="$(
              openssl x509 \
                -in "${certificate}" \
                -noout \
                -subject \
                -nameopt RFC2253 |
              sed 's/^subject=//' |
              sed -n 's/^CN=\([^,]*\).*/\1/p'
            )"
            
            {
              echo
              echo "${common_name}"
              printf '%*s\n' "${#common_name}" '' | tr ' ' '='
              echo "# Issuer: ${issuer}"
              echo "# Serial Number:${serial_number}"
              echo "# Subject: ${subject}"
              echo "# Not Valid Before: ${not_before}"
              echo "# Not Valid After : ${not_after}"
              echo "# Fingerprint (SHA-256): ${sha256_fingerprint}"
              echo "# Fingerprint (SHA1): ${sha1_fingerprint}"
            
              sed '/^$/d' "${certificate}"
              # echo
            } >> cacert.pem
            
            echo "${fingerprint}" >> "${existing_fingerprints}"
            
            custom_certificate_added=$((custom_certificate_added + 1))
          done

          {
            echo "certificate_count=${custom_certificate_count}"
            echo "added_count=${custom_certificate_added}"
            echo "duplicate_count=${custom_certificate_duplicate}"
          } >> "${GITHUB_OUTPUT}"

          echo
          echo "Custom CA certificates:"
          echo "  Found:      ${custom_certificate_count}"
          echo "  Added:      ${custom_certificate_added}"
          echo "  Duplicates: ${custom_certificate_duplicate}"

      - name: Validate generated CA bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          certificate_count="$(
            grep -c '^-----BEGIN CERTIFICATE-----$' cacert.pem
          )"

          end_certificate_count="$(
            grep -c '^-----END CERTIFICATE-----$' cacert.pem
          )"

          if [ "${certificate_count}" -ne "${end_certificate_count}" ]; then
            echo "::error::Mismatched certificate markers"
            exit 1
          fi

          if [ "${certificate_count}" -eq 0 ]; then
            echo "::error::CA bundle does not contain any certificates"
            exit 1
          fi

          echo "Certificate count: ${certificate_count}"

          openssl crl2pkcs7 \
            -nocrl \
            -certfile cacert.pem |
          openssl pkcs7 \
            -print_certs \
            -noout

          sha256="$(
            sha256sum cacert.pem |
            awk '{print $1}'
          )"

          echo "certificate_count=${certificate_count}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

          echo
          echo "CA bundle SHA256:"
          echo "${sha256}"


      - name: Check for bundle changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
      
          if git diff --quiet -- cacert.pem; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes detected in cacert.pem."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Changes detected in cacert.pem."
          fi


      - name: Generate metadata.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          previous_generated_at=""
          previous_bundle_sha256=""

          if [ -f metadata.json ]; then
            previous_generated_at="$(
              jq -r '.generated_at // empty' metadata.json
            )"

            previous_bundle_sha256="$(
              jq -r '.bundle.sha256 // empty' metadata.json
            )"
          fi

          current_bundle_sha256="${{ steps.bundle.outputs.sha256 }}"

          if [ "${current_bundle_sha256}" = "${previous_bundle_sha256}" ] &&
             [ -n "${previous_generated_at}" ]; then
            generated_at="${previous_generated_at}"
          else
            generated_at="$(
              date --utc '+%Y-%m-%dT%H:%M:%SZ'
            )"
          fi

          jq -n \
            --arg source_name \
              "Mozilla NSS Root Certificate Store" \
            --arg source_url \
              "${CERTDATA_URL}" \
            --arg source_tree \
              "mozilla-release" \
            --arg source_sha256 \
              "${{ steps.source.outputs.sha256 }}" \
            --arg generator_name \
              "mk-ca-bundle.pl" \
            --arg generator_repository \
              "${CURL_REPOSITORY}" \
            --arg generator_commit \
              "${CURL_COMMIT}" \
            --arg generator_version \
              "${{ steps.generator.outputs.version }}" \
            --arg custom_ca_directory \
              "${CUSTOM_CA_DIRECTORY}" \
            --arg bundle_file \
              "cacert.pem" \
            --arg bundle_sha256 \
              "${{ steps.bundle.outputs.sha256 }}" \
            --argjson certificate_count \
              "${{ steps.bundle.outputs.certificate_count }}" \
            --argjson custom_certificate_count \
              "${{ steps.custom_cas.outputs.certificate_count }}" \
            --argjson custom_certificate_added \
              "${{ steps.custom_cas.outputs.added_count }}" \
            --argjson custom_certificate_duplicate \
              "${{ steps.custom_cas.outputs.duplicate_count }}" \
            --arg generated_at \
              "${generated_at}" \
            '{
              source: {
                name: $source_name,
                url: $source_url,
                tree: $source_tree,
                sha256: $source_sha256
              },
              generator: {
                name: $generator_name,
                repository: $generator_repository,
                commit: $generator_commit,
                version: $generator_version
              },
              custom_cas: {
                directory: $custom_ca_directory,
                certificate_count: $custom_certificate_count,
                added_count: $custom_certificate_added,
                duplicate_count: $custom_certificate_duplicate
              },
              bundle: {
                file: $bundle_file,
                sha256: $bundle_sha256,
                certificate_count: $certificate_count
              },
              generated_at: $generated_at
            }' > metadata.json

          jq . metadata.json


      - name: Validate changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --check

      - name: Show changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff --stat -- cacert.pem metadata.json

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: "${{ secrets.GH_TOKEN }}"
          sign-commits: true
          branch: "${{ steps.metadata.outputs.gh_branch_name }}"
          delete-branch: true
          commit-message: "chore: update Mozilla CA bundle"
          title: "chore: update Mozilla CA bundle"
          body: |
            ## Mozilla CA bundle update

            This PR updates the CA bundle generated from the
            Mozilla NSS `certdata.txt`.

            ### Source

            `${{ env.CERTDATA_URL }}`

            ### Generator

            `mk-ca-bundle.pl`
            curl commit: `${{ env.CURL_COMMIT }}`
            version: `${{ steps.generator.outputs.version }}`

            ### Custom CA certificates

            Directory:
            `${{ env.CUSTOM_CA_DIRECTORY }}/`

            Found:
            `${{ steps.custom_cas.outputs.certificate_count }}`

            Added:
            `${{ steps.custom_cas.outputs.added_count }}`

            Already present:
            `${{ steps.custom_cas.outputs.duplicate_count }}`

            ### Bundle

            Certificates:
            `${{ steps.bundle.outputs.certificate_count }}`

            SHA256:
            `${{ steps.bundle.outputs.sha256 }}`

            The generated bundle was validated with OpenSSL.

            `metadata.json` contains the complete provenance information.

            This PR was created automatically by GitHub Actions.

          labels: |
            automated
            dependencies
