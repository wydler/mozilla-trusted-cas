---
name: Attach cacert.pem to Release

"on":
  workflow_dispatch:
  release:
    types:
      - prereleased
      - released

permissions:
  contents: write

jobs:
  upload-asset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Verify file cacert.pem
        run: |
          ls -l
          test -f cacert.pem

      - name: Upload cacert.pem
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: cacert.pem
          overwrite_files: true
